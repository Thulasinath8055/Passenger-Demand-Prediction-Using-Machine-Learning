<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TransitML – Passenger Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prediction-card {
            background: #ffffff;
            width: 420px;
            padding: 40px 45px;
            border-radius: 14px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e88e5;
            font-size: 1.8rem;
        }

        label {
            font-size: 0.95rem;
            color: #444;
        }

        select,
        input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #1e88e5;
            box-shadow: 0 0 0 2px rgba(30, 136, 229, 0.15);
        }

        .form-group {
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #1e88e5;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1565c0;
        }

        .logout {
            text-align: center;
            margin-top: 20px;
        }

        .logout a {
            color: #e53935;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .logout a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="prediction-card">
        <h2>Hyderabad Metro Passenger Demand Prediction</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label><b>Select Station</b></label>
                <select name="station" required>
                    <option value="">-- Choose Station --</option>
                    <option value="Miyapur">Miyapur</option>
                    <option value="JNTU College">JNTU College</option>
                    <option value="KPHB Colony">KPHB Colony</option>
                    <option value="Kukatpally">Kukatpally</option>
                    <option value="Ameerpet">Ameerpet</option>
                    <option value="Punjagutta">Punjagutta</option>
                    <option value="Begumpet">Begumpet</option>
                    <option value="Secunderabad">Secunderabad</option>
                    <option value="MG Bus Station">MG Bus Station</option>
                    <option value="Nagole">Nagole</option>
                </select>
            </div>

            <div class="form-group">
                <label><b>Select Date</b></label>
                <input type="date" name="date" required>
            </div>

            <div class="form-group">
                <label><b>Select Hour (0–23)</b></label>
                <input type="number" name="hour" min="0" max="23" required>
            </div>

            <button type="submit">Predict Passengers</button>
        </form>

        <div class="logout">
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

</body>
</html>
